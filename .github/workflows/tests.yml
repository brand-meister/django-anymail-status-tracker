name: Tests

on:
  pull_request:
      branches: [master]
permissions:  
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest --cov
