name: Tests

on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest --cov
