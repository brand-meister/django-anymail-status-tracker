name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.0 or 1.2.0rc1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
        run: |
          # PEP 440: 1.2.3, 1.2.3rc1, 1.2.3a1, 1.2.3b2, optional .postN / .devN
          pep440_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)((a|b|rc)(0|[1-9][0-9]*))?(\.post(0|[1-9][0-9]*))?(\.dev(0|[1-9][0-9]*))?$'
          if ! [[ "$INPUT_VERSION" =~ $pep440_pattern ]]; then
            echo "::error::Invalid PEP 440 version: $INPUT_VERSION (examples: 1.2.0, 1.2.0rc1)"
            exit 1
          fi

          is_prerelease=false
          if [[ "$INPUT_VERSION" =~ (a|b|rc)[0-9]+ ]] || [[ "$INPUT_VERSION" =~ \.dev[0-9]+ ]]; then
            is_prerelease=true
          fi

          if [[ "$is_prerelease" != true && "$REF" != "refs/heads/master" ]]; then
            echo "::error::Final releases must be cut from master (got $REF). Use an rc/a/b version for other branches."
            exit 1
          fi

          echo "VERSION=$INPUT_VERSION" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$is_prerelease" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v5

      - name: Set version
        run: uv version "$VERSION"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          if git diff --staged --quiet; then
            echo "::error::No version changes to commit for ${VERSION}"
            exit 1
          fi
          git commit -m "release v${VERSION}"
          git push origin "HEAD:refs/heads/${{ github.ref_name }}"

      - name: Build packages
        run: uv build

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          assets=(dist/*.whl dist/*.tar.gz)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::No build artifacts found in dist/"
            exit 1
          fi

          prerelease_args=()
          if [[ "$IS_PRERELEASE" == true ]]; then
            prerelease_args=(--prerelease)
          fi

          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --generate-notes \
            --target "$(git rev-parse HEAD)" \
            "${prerelease_args[@]}" \
            "${assets[@]}"
